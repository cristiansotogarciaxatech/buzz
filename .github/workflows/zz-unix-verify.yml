name: Unix verify (scratch)

# Scratch workflow. Lives only on the ci/unix-verify-* branches of the fork so
# the dev-mcp temp-dir sweep can be executed on Linux and macOS, which the
# development machine cannot do. Never merged, never part of PR #6029.

on:
  push:
  workflow_dispatch:

jobs:
  dev-mcp:
    name: dev-mcp tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Toolchain
        run: |
          cargo --version
          rustc --version --verbose
      - name: Tests
        run: cargo test -p buzz-dev-mcp -- --test-threads=4
      - name: Clippy
        if: always()
        run: cargo clippy -p buzz-dev-mcp --all-targets -- -D warnings
