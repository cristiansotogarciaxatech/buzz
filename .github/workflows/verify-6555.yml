name: verify-6555
on: push

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: rustc version
        run: rustc --version && cargo --version
      - name: fmt
        run: cargo fmt -p buzz-cli -- --check
      - name: clippy
        run: cargo clippy -p buzz-cli --all-targets -- -D warnings
      - name: test
        run: cargo test -p buzz-cli
