name: mention-boundary-probe

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr2547-0a39d45d
            ref: 0a39d45d747b17be93d40269895cbc7dd4a7c3f5
    steps:
      - name: Fetch block/buzz at ${{ matrix.ref }}
        run: |
          set -euo pipefail
          git init -q tree
          cd tree
          git remote add origin https://github.com/block/buzz.git
          git fetch -q --depth 1 origin ${{ matrix.ref }}
          git checkout -q FETCH_HEAD
          echo "HEAD is $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"

      - name: Append probe test to buzz-sdk mentions.rs
        run: |
          set -euo pipefail
          cd tree
          python3 - <<'PY'
          p = 'crates/buzz-sdk/src/mentions.rs'
          src = open(p, encoding='utf-8').read()
          probe = r'''
              #[test]
              fn zzz_bom_probe() {
                  let known = ["Scout"];
                  let cases: [(&str, &str); 7] = [
                      ("bare_start", "@Scout hi"),
                      ("bom_start", "\u{feff}@Scout hi"),
                      ("bold_start", "**@Scout** hi"),
                      ("nbsp_start", "\u{a0}@Scout hi"),
                      ("zwsp_start", "\u{200b}@Scout hi"),
                      ("bom_after_newline", "line one\n\u{feff}@Scout hi"),
                      ("bom_then_space", "\u{feff} @Scout hi"),
                  ];
                  for (label, input) in cases {
                      println!(
                          "PROBE {label} with_known={:?} at_names={:?}",
                          extract_at_mentions_with_known(input, &known),
                          extract_at_names(input)
                      );
                  }
                  println!("PROBE lead_star={} lead_us={} wb_star={}", is_mention_lead_at("*@x", 1), is_mention_lead_at("_@x", 1), is_word_boundary("** hi"));
                  println!(
                      "PROBE charprops feff_ws={} feff_alnum={} nbsp_ws={} nbsp_ascii_ws={} zwsp_ws={}",
                      '\u{feff}'.is_whitespace(),
                      '\u{feff}'.is_ascii_alphanumeric(),
                      '\u{a0}'.is_whitespace(),
                      '\u{a0}'.is_ascii_whitespace(),
                      '\u{200b}'.is_whitespace()
                  );
                  // Positive control: the plain case must resolve on every ref.
                  // If this fails the harness is wrong, not the parser.
                  assert_eq!(
                      extract_at_mentions_with_known("@Scout hi", &known),
                      vec!["scout".to_string()]
                  );
              }
          '''
          i = src.rstrip().rfind('\n}')
          assert i > 0, 'could not find closing brace of tests module'
          out = src[:i] + '\n' + probe + '}\n'
          assert 'zzz_bom_probe' in out
          open(p, 'w', encoding='utf-8', newline='\n').write(out)
          print('probe inserted')
          PY
          grep -n zzz_bom_probe crates/buzz-sdk/src/mentions.rs
          echo "--- context around insertion ---"
          grep -n "mod tests\|^}" crates/buzz-sdk/src/mentions.rs | tail -8

      - name: Run probe
        run: |
          set -euo pipefail
          cd tree
          cargo test -p buzz-sdk --lib zzz_bom_probe -- --nocapture
