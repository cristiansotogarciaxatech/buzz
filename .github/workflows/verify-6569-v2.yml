name: verify-6569-v2
on: push

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: cargo --version && cargo fmt --version
      - name: prove production source is byte-identical to PR 6569 head dfcbe232
        run: |
          echo "sha under test: $(git rev-parse HEAD)"
          echo "PR head (parent): $(git rev-parse HEAD^)"
          echo "--- files changed vs PR head (workflow only) ---"
          git diff --name-only HEAD^ HEAD
          echo "--- sha256 of messages.rs ---"
          sha256sum crates/buzz-cli/src/commands/messages.rs
      - name: just fmt-check equivalent, the upstream Rust Lint gate
        run: cargo fmt --all -- --check
