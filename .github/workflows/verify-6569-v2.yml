name: verify-6569-v2
on: push

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version && cargo fmt --version
      - name: prove production source is byte-identical to PR 6569 head dfcbe232
        run: |
          echo "sha under test: $(git rev-parse HEAD)"
          echo "parent (PR head): $(git rev-parse HEAD^)"
          git diff --stat HEAD^ HEAD
          sha256sum crates/buzz-cli/src/commands/messages.rs
      - name: just fmt-check equivalent, the upstream Rust Lint gate
        run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum crates/buzz-cli/src/commands/messages.rs
      - name: buzz-cli test suite at the PR head
        run: cargo test -p buzz-cli
